<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 4</title>
  <style>
    html {
      box-sizing: border-box;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }

    .padre {
      width: 50%;
      min-width: 200px;
      max-width: 300px;
      padding: 10px;
      background-color: lightblue;
    }
    .hijo {
      width: 50%;
      padding: 10px;
      background-color: lightcoral;
    }
  </style>
</head>
<body>
  <div class="padre">
    <div class="hijo">H</div>
  </div>
</body>
</html>
