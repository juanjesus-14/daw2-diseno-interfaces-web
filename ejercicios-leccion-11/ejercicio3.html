<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 3</title>
  <style>
    html {
      box-sizing: border-box;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }

    .padre {
      width: 200px;
      padding: 10px;
      background-color: lightblue;
    }

    .hijo {
      width: 100%;
      background-color: lightcoral;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="padre">
    <div class="hijo">Pulsa</div>
  </div>
</body>
</html>
